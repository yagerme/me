<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAGER Family Tree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --accent: #c9a227;
            --accent-glow: rgba(201, 162, 39, 0.3);
            --text-primary: #e8e8e8;
            --text-secondary: #888;
            --border: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .bg-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(201, 162, 39, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 162, 39, 0.03) 0%, transparent 50%);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--accent);
            letter-spacing: 0.3em;
            margin-bottom: 60px;
            text-align: center;
        }

        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 20px auto 0;
        }

        .tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
        }

        .generation {
            display: flex;
            gap: 60px;
            position: relative;
        }

        .person {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
            transition: all 0.3s;
        }

        .person:hover .photo {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--accent-glow);
        }

        .photo.father {
            width: 150px;
            height: 150px;
            font-size: 3rem;
        }

        .name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .role {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .connector {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 40px;
            background: var(--accent);
        }

        .horizontal-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 120px);
            height: 2px;
            background: var(--accent);
            display: none;
        }

        .generation.sons .horizontal-line {
            display: block;
        }

        .vertical-line {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 40px;
            background: var(--accent);
        }

        .generation.sons {
            position: relative;
            padding-top: 40px;
        }

        .generation.sons::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 120px);
            height: 2px;
            background: var(--accent);
        }

        .son .connector {
            display: none;
        }

        footer {
            margin-top: 80px;
            padding: 40px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            width: 100%;
        }

        footer span {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .generation {
                flex-direction: column;
                gap: 40px;
            }

            .generation.sons::before {
                width: 2px;
                height: calc(100% - 60px);
                left: 60px;
                top: 0;
                transform: none;
            }

            .photo {
                width: 100px;
                height: 100px;
                font-size: 2rem;
            }

            .photo.father {
                width: 120px;
                height: 120px;
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effect"></div>

    <h1>YAGER FAMILY</h1>

    <div class="tree">
        <!-- 父亲 -->
        <div class="generation">
            <div class="person father">
                <div class="photo father">Y</div>
                <div class="name">YAGER</div>
                <div class="role">Father · 父亲</div>
            </div>
        </div>

        <!-- 儿子们 -->
        <div class="generation sons">
            <div class="person son">
                <div class="photo">J</div>
                <div class="name">Jason</div>
                <div class="role">Son · 儿子</div>
            </div>
            <div class="person son">
                <div class="photo">J</div>
                <div class="name">Jesper</div>
                <div class="role">Son · 儿子</div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 <span>YAGER</span> Family. All rights reserved.</p>
    </footer>
</body>
</html>
